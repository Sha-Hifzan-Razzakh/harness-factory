[project]
name = "harness-factory"
version = "0.1.0"
description = "Builds, measures and selects agent harnesses per task class."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "litellm>=1.50",
    "langgraph>=0.2",
    "mcp>=1.6",
    "sqlalchemy>=2.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mlops = ["mlflow>=2.14"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
hfx = "harness_factory.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["PYI034", "C408", "TRY004"]
