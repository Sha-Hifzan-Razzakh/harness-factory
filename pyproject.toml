[project]
name = "harness-factory"
version = "0.1.0"
description = "Builds, measures and selects agent harnesses per task class."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "litellm>=1.80,<2",
    "langgraph>=1.0,<2",          # StateGraph API used by shapes/
    "mcp>=2.3,<3",                # MCPServer / ToolError (renamed from FastMCP in 2.x)
    "anyio>=4.5",                 # tool-call timeouts
    "sqlalchemy>=2.0,<3",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "typer>=0.15",
    "rich>=13",
    "pytest>=8",                  # the code server and tests_pass checks run task tests with it (ADR 0012)
    "jsonschema>=4.20",           # json_schema checks (grading/state.py); was only transitive (mcp, litellm)
    "alembic>=1.14,<2",
    "langgraph-checkpoint-sqlite>=3,<4",  # opt-in pause/resume (HF_CHECKPOINT); offline saver
    "openinference-semantic-conventions>=0.1.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mlops = ["mlflow>=2.14"]
inspect = ["inspect-ai>=0.3.285,<0.4"]        # optional outer shell; see docs/adr/0001-inspect-ai.md
# The built-in MCP servers' libraries, pinned exactly: the docs server's (docx, xlsx, pdf) and the audit server's
# degree_audit_core (git tag core-v0.1.0, by commit; docs/adr/0021-degree-audit-server.md). They are the allow-list
# in src/harness_factory/env/mcp/deps.py and go into the sandbox image (docs/adr/0013-server-dependencies.md).
docs = ["python-docx==1.2.0", "openpyxl==3.1.5", "pypdf==6.20.1",
        "degree-audit @ git+https://github.com/Sha-Hifzan-Razzakh/DegreeAudit@824682286a344762dbe7656bffb9f3a61465afdd"]
# Retrieval dimension (ADR 0017): LlamaIndex's own documents, splitters, retrievers and fusion; Qdrant in local
# (in-memory) mode for the dense index. Runs in the factory process, never in the sandbox.
retrieval = [
    "llama-index-core>=0.14.25,<0.15",
    "llama-index-retrievers-bm25>=0.8.0,<0.9",
    "llama-index-vector-stores-qdrant>=0.10.4,<0.11",
    "qdrant-client>=1.20.0,<2",
]
analysis = ["polars>=1.20", "scipy>=1.15"]  # hfx analyze: shape x model tables, bootstrap CIs (ANL-01)
# Framework runners (docs/adr/0016-runner-axis.md). Their exact versions are part of a runner run's identity.
langgraph-prebuilt = ["langchain[mcp]>=1.4.7,<1.5"]          # create_agent + langchain.mcp (FastMCP client)
llamaindex = ["llama-index-core>=0.14.25,<0.15", "llama-index-tools-mcp>=0.6.0,<0.7"]
ms-agent-framework = ["agent-framework-core>=1.24.0,<2"]     # Agent + MCPStdioTool; the `agent-framework` meta package adds only provider connectors
# AutoGen is in maintenance mode (fixes only, since Oct 2025): for existing deployments and the migration check against
# Microsoft Agent Framework (RUN-11). autogen-core pins protobuf~=5.29.3 in every release, so the lock moves protobuf
# 7.36.2 -> 5.29.6 (and googleapis-common-protos 1.76.0 -> 1.75.0). autogen-ext[openai] for its OpenAI converters;
# not [mcp]: autogen-ext's MCP tools don't import under MCP 2.x. Semantic Kernel can't be installed: every 1.x pins
# pydantic<2.14 (1.45+ also mcp<2). ADR 0016, addendum #55.
autogen-agentchat = ["autogen-agentchat>=0.7.5,<0.8", "autogen-ext[openai]>=0.7.5,<0.8"]
# langgraph-supervisor is "active" but no longer recommended by LangChain for new code (see ADR 0016, #56)
langgraph-supervisor = ["langgraph-supervisor>=0.0.31,<0.1", "langchain>=1.4.7,<1.5"]
pydantic-ai = ["pydantic-ai-slim[mcp]>=2.64,<2.65"]   # Agent + MCP toolset (FastMCP client)
# 0.20.x is the newest release on openai<3: 0.21+ needs openai>=3, which litellm (<3) excludes
openai-agents = ["openai-agents>=0.20.0,<0.21"]
emulation = ["instructor>=1.17,<2"]               # tool-call emulation for models without native tool calling
api = ["fastapi>=0.115", "uvicorn>=0.32", "httpx>=0.27"]   # hfx serve; see docs/adr/0009-authoring-layer.md
ui = ["streamlit>=1.40", "httpx>=0.27"]                     # hfx ui: talks to the API only
dev = ["harness-factory[analysis,api,autogen-agentchat,emulation,langgraph-prebuilt,langgraph-supervisor,llamaindex,ms-agent-framework,openai-agents,pydantic-ai,retrieval,ui]",
       "pytest>=8", "pytest-asyncio>=1.0", "pytest-xdist>=3.6", "ruff>=0.15", "testcontainers[postgres]>=4.15",
       "psycopg[binary]>=3.1"]
checkpoint-postgres = ["langgraph-checkpoint-postgres>=3,<4", "psycopg[binary]>=3.1"]   # HF_CHECKPOINT=postgres

[project.scripts]
hfx = "harness_factory.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true      # the git-pinned degree_audit_core in the docs extra (ADR 0021)

[tool.hatch.build.targets.wheel]
packages = ["src/harness_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["PYI034", "C408", "TRY004"]
