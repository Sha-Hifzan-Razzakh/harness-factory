name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Jobs run side by side; the slow ones are split. The six checks the main ruleset requires ("test (py3.12)",
  # "test (py3.13)", "offline gates", "docker sandbox gate", "container (Dockerfile + compose)", "prompt smoke
  # checks (promptfoo)") keep their names: the split jobs report into summary jobs of those names, which run even
  # when a part fails (`if: always()`), because a skipped required check would count as passing.

  # The suite in three shards per Python (HF_TEST_SHARD, tests/conftest.py): together they run every test once.
  tests:
    name: tests py${{ matrix.python }} (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        shard: [1, 2, 3]
    env:
      HF_RESULTS_URL: sqlite:///${{ github.workspace }}/var/results.db
      COLUMNS: "160"
      HF_REQUIRE_DOCKER: "1"        # Docker isolation tests fail instead of skipping
      HF_REQUIRE_POSTGRES: "1"      # results-store tests also run on Postgres (testcontainers), never skip
      HF_TEST_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra dev --extra inspect --extra docs --python ${{ matrix.python }}

      - name: Tests (one shard)
        run: uv run --no-sync pytest -q -n auto

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-test-py${{ matrix.python }}-${{ matrix.shard }}
          path: var/traces
          if-no-files-found: ignore

  # Lint and the catalog checks: the same on any Python, so once.
  catalog:
    name: lint and catalog checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_RESULTS_URL: sqlite:///${{ github.workspace }}/var/results.db
      COLUMNS: "160"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra dev --extra inspect --extra docs --python 3.13

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Recipes validate
        run: uv run --no-sync hfx validate

      - name: Tool schemas frozen (no drift)
        run: uv run --no-sync hfx tools freeze --check

      - name: Perturbed variants generated from their specs (no drift)
        run: uv run --no-sync hfx perturb --check

      - name: Reference solutions pass their oracles
        run: uv run --no-sync hfx reference

  # The React workspace (web/, ADR 0022): type-check and build exactly as `hfx web --build` does.
  web:
    name: web workspace (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install (locked)
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        working-directory: web
        run: npm run build

  test:
    name: test (py${{ matrix.python }})
    if: always()
    needs: [tests, catalog, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - name: Every test shard, the catalog checks and the web build passed
        run: |
          echo "tests: ${{ needs.tests.result }}   catalog: ${{ needs.catalog.result }}   web: ${{ needs.web.result }}"
          test "${{ needs.tests.result }}" = success && test "${{ needs.catalog.result }}" = success && test "${{ needs.web.result }}" = success

  # Offline gates: every shape and matrix recipe solves the visible tasks with the scripted model, in parallel
  # parts. The recipe lists come from the catalog (scripts/ci/recipes.py, a group and optionally a part i/n): a new
  # recipe is gated without editing this file. `long` tasks are left out where a shape's caps or a framework's
  # untrimmed history can't fit them; `needs-retry` and `perturbation` variants (TSK-04) have their own gate, with
  # the retry model.
  gate-parts:
    name: gates (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: P0, shapes, planned matrix
            run: |
              uv run --no-sync hfx smoke --models scripted/replay --strict -j 8 --exclude-tag needs-retry
              uv run --no-sync hfx smoke --recipe "$(uv run --no-sync python scripts/ci/recipes.py shapes)" --models scripted/replay --strict -j 8 --exclude-tag long,needs-retry
              uv run --no-sync hfx smoke --recipe "$(uv run --no-sync python scripts/ci/recipes.py matrix-planned)" --models scripted/replay --strict -j 8 --exclude-tag long,perturbation
          - part: matrix 1/2
            run: uv run --no-sync hfx smoke --recipe "$(uv run --no-sync python scripts/ci/recipes.py matrix 1/2)" --models scripted/replay --strict -j 8 --exclude-tag perturbation
          - part: matrix 2/2
            run: uv run --no-sync hfx smoke --recipe "$(uv run --no-sync python scripts/ci/recipes.py matrix 2/2)" --models scripted/replay --strict -j 8 --exclude-tag perturbation
          - part: runners, migration check
            run: |
              uv run --no-sync hfx smoke --recipe "$(uv run --no-sync python scripts/ci/recipes.py runners)" --models scripted/replay --strict -j 8 --exclude-tag long,needs-retry
              uv run --no-sync hfx transfer run v2-autogen-agentchat --baseline v2-ms-agent-framework --model scripted/replay --provider scripted --run --min-pairs 20 -j 8 | tee transfer.txt
              grep -q '^equivalent:' transfer.txt
          - part: faults, retry, emulation
            run: |
              uv run --no-sync hfx smoke --recipe v2-base --models scripted/retry --faults none,first-call-fails,slow-tools --strict -j 8
              uv run --no-sync hfx smoke --recipe v2-base,v2-biz,v2-docs --models scripted/retry --strict -j 8 --tag needs-retry
              uv run --no-sync hfx smoke --models scripted/emulated --strict -j 8 --exclude-tag needs-retry
          - part: conformance, Inspect
            run: |
              uv run --no-sync hfx conformance
              uv run --no-sync inspect eval src/harness_factory/integrations/inspect_task.py \
                --model mockllm/model -T recipe=v2-base --epochs 2 --log-dir var/inspect-logs --display plain
    env:
      HF_RESULTS_URL: sqlite:///${{ github.workspace }}/var/results.db
      COLUMNS: "160"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra dev --extra inspect --extra docs --python 3.13

      - name: ${{ matrix.part }}
        run: ${{ matrix.run }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-gates-${{ strategy.job-index }}
          path: var/traces
          if-no-files-found: ignore

  gates:
    name: offline gates
    if: always()
    needs: [gate-parts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every gate part passed
        run: |
          echo "gate parts: ${{ needs.gate-parts.result }}"
          test "${{ needs.gate-parts.result }}" = success

  docker-parts:
    name: docker sandbox (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: references, conformance
            run: |
              uv run --no-sync hfx reference
              uv run --no-sync hfx conformance --sandbox docker
          - part: smoke
            run: |
              uv run --no-sync hfx smoke --recipe v2-base,v2-docs,v2-web,v2-outbox --models scripted/replay --strict -j 8 --exclude-tag needs-retry
              uv run --no-sync hfx smoke --recipe v3-staged --models scripted/replay --strict -j 8 --exclude-tag long,needs-retry
              uv run --no-sync hfx smoke --recipe v2-code --models scripted/replay --strict -j 8 --exclude-tag needs-retry
    env:
      HF_RESULTS_URL: sqlite:///${{ github.workspace }}/var/results.db
      COLUMNS: "160"
      HF_SANDBOX: docker
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra dev --extra docs --python 3.13

      - name: Inside containers, ${{ matrix.part }}
        run: ${{ matrix.run }}

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-docker-${{ strategy.job-index }}
          path: var/traces
          if-no-files-found: ignore

  docker-gate:
    name: docker sandbox gate
    if: always()
    needs: [docker-parts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Docker part passed
        run: |
          echo "docker parts: ${{ needs.docker-parts.result }}"
          test "${{ needs.docker-parts.result }}" = success

  container:
    name: container (Dockerfile + compose)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COLUMNS: "160"
    steps:
      - uses: actions/checkout@v4

      - name: Build the factory image
        run: docker build -t harness-factory:local .

      - name: Gates inside the image (non-root, no network, no secrets)
        run: |
          docker run --rm --network none harness-factory:local validate
          docker run --rm --network none harness-factory:local reference
          docker run --rm --network none harness-factory:local smoke --models scripted/replay --strict --exclude-tag needs-retry
          docker run --rm --network none harness-factory:local conformance
          docker run --rm --entrypoint sh harness-factory:local -c 'test "$(id -u)" != 0 && test ! -e /app/.env'

      - name: Compose (Docker sandboxes from inside the factory container)
        run: |
          docker compose config -q
          mkdir -p var
          export HF_UID=$(id -u) HF_GID=$(id -g) DOCKER_GID=$(stat -c %g /var/run/docker.sock)
          docker compose run --rm --pull never factory smoke --recipe v2-base --models scripted/replay --strict --exclude-tag needs-retry
          docker compose run --rm --pull never factory-docker \
            smoke --recipe v2-base,v3-staged --models scripted/replay --strict --exclude-tag long,needs-retry
          test -z "$(docker ps -aq --filter label=hf.sandbox=1)"      # every sandbox container removed
          test -z "$(ls -A var/sandboxes)"                             # and every sandbox directory

  # Prompt smoke checks (SKP-03): promptfoo renders every recipe's real prompts and checks them, offline (echo
  # provider, no keys). See README "Prompt smoke checks".
  prompts:
    name: prompt smoke checks (promptfoo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install (locked)
        run: uv sync --locked --extra docs --python 3.13      # loading the catalog imports the docs server's libraries

      - name: promptfoo eval (offline, echo provider)
        run: |
          mkdir -p var/promptfoo
          uv run --no-sync npx --yes promptfoo@0.124.1 eval -c promptfoo/promptfooconfig.yaml \
            --no-table --no-write --no-progress-bar -o var/promptfoo/results.json

      - name: promptfoo canaries (each broken template must fail its check)
        run: |
          uv run --no-sync npx --yes promptfoo@0.124.1 eval -c promptfoo/canaries.yaml \
            --no-table --no-write --no-progress-bar -o var/promptfoo/canaries.json

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-results
          path: var/promptfoo
          if-no-files-found: ignore
