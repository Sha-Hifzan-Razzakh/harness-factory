# Alembic config for the results store, for the alembic CLI only. ResultsStore() runs the same migrations
# itself when it opens a store (results/store.py: upgrade), so nothing here is needed to use the factory.
#
#   uv run alembic -c src/harness_factory/results/migrations/alembic.ini revision -m "add runs.foo"
#   uv run alembic -c src/harness_factory/results/migrations/alembic.ini upgrade head     # HF_RESULTS_URL
#
# The database is HF_RESULTS_URL (or var/results.db), read by env.py; there is no URL in this file.

[alembic]
script_location = %(here)s
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
