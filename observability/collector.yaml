# OpenTelemetry Collector: the factory exports OTLP once; the collector fans out to Phoenix and Langfuse.
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  batch: {}

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006            # Phoenix accepts OTLP at /v1/traces
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}  # e.g. http://langfuse-web:3000/api/public/otel
    headers:
      Authorization: "Basic ${env:LANGFUSE_AUTH}"   # base64("pk-lf-...:sk-lf-...")
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix, otlphttp/langfuse]
