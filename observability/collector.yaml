# OpenTelemetry Collector: the factory exports OTLP once; the collector fans out to Phoenix and Langfuse.
# MLflow gets the same traces too (otlphttp/mlflow).
receivers:
  otlp:
    protocols:
      http: {endpoint: 0.0.0.0:4318}
      grpc: {endpoint: 0.0.0.0:4317}

processors:
  batch: {}

extensions:
  # Langfuse authenticates OTLP with HTTP Basic auth: public key as user, secret key as password.
  basicauth/langfuse:
    client_auth:
      username: ${env:LANGFUSE_PUBLIC_KEY}
      password: ${env:LANGFUSE_SECRET_KEY}

exporters:
  otlphttp/phoenix:
    endpoint: http://phoenix:6006            # Phoenix accepts OTLP at /v1/traces
  otlphttp/langfuse:
    endpoint: ${env:LANGFUSE_OTLP_ENDPOINT}  # http://langfuse-web:3000/api/public/otel (+ /v1/traces); HTTP only
    auth: {authenticator: basicauth/langfuse}
    headers:
      x-langfuse-ingestion-version: "4"      # spans show up at once (v4 data model), not after a delay
  # MLflow >= 3.6 ingests OTLP/HTTP at /v1/traces (no gRPC) into the experiment the header names, and maps the
  # OpenInference attributes (span kinds, input/output values, model, token counts, session.id). Its backend store
  # must be SQL (compose: SQLite). The id is the number in MLflow's /#/experiments/<id> URL for "harness-factory".
  otlphttp/mlflow:
    endpoint: http://mlflow:5000
    headers:
      x-mlflow-experiment-id: ${env:MLFLOW_EXPERIMENT_ID}
  debug:
    verbosity: basic

service:
  extensions: [basicauth/langfuse]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/phoenix, otlphttp/langfuse, otlphttp/mlflow]
