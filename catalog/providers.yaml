# Provider catalog (B6). The canonical model is the experiment variable; the provider is infrastructure.
# Model ids and limits for real providers are examples: verify against each provider's model list and
# rate-limit page before a campaign. Prices are $ per million tokens (reference price when free).
providers:
  - id: scripted
    kind: scripted
    data_terms: local
    models:
      - {canonical: scripted/replay, provider_model_id: replay}   # follows the reference plan
      - {canonical: scripted/noisy,  provider_model_id: noisy}    # one bad call first, then recovers
      - {canonical: scripted/lazy,   provider_model_id: lazy}     # stops one step early
      - {canonical: scripted/retry,  provider_model_id: retry}    # retries a step after a tool error
      - {canonical: scripted/invent, provider_model_id: invent}   # first call names a tool that doesn't exist
      - {canonical: scripted/delegate, provider_model_id: delegate}   # hands the task to a helper when it can
      # No native tool calling: writes its calls as JSON text, which tool-call emulation (instructor) parses (SUB-02)
      - {canonical: scripted/emulated, provider_model_id: emulated, caps: {tool_calling: emulated}}

  # The offline rubric judge (grading/judge.ScriptedJudgeBackend, ADR 0014): deterministic, never calibrated.
  # Its own provider, so a smoke over the scripted provider's models never runs it as an agent.
  - id: scripted-judge
    kind: scripted
    data_terms: local
    models:
      - {canonical: scripted/judge, provider_model_id: judge}

  - id: groq
    kind: litellm
    litellm_prefix: groq
    auth_env: GROQ_API_KEY
    data_terms: "no training on API data (verify)"
    # Free / Developer plan base limits, per model (console.groq.com/docs/rate-limits, checked 2026-10-29).
    # Your organization's exact limits: console.groq.com/settings/limits.
    limits: {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000, scope: model}
    # Llama 3.3 70B and Qwen3 32B were shut down for free and Developer accounts in Jul/Aug 2026.
    # Prices: list $/M (free tier is not billed), as published for GroqCloud in Oct 2026.
    models:
      - {canonical: gpt-oss-120b, provider_model_id: openai/gpt-oss-120b, price_in: 0.15,  price_out: 0.60, free: true,
         caps: {context_len: 131072}}
      - {canonical: gpt-oss-20b,  provider_model_id: openai/gpt-oss-20b,  price_in: 0.075, price_out: 0.30, free: true,
         caps: {context_len: 131072}}
      # Preview: Groq says preview models are for evaluation and may be discontinued at short notice.
      - {canonical: qwen3.8-27b,  provider_model_id: qwen/qwen3.8-27b,    price_in: 0.80,  price_out: 4.00, free: true,
         caps: {context_len: 131072}}

  - id: openrouter
    kind: litellm
    litellm_prefix: openrouter
    auth_env: OPENROUTER_API_KEY
    data_terms: "depends on upstream; set provider data policy in account (verify)"
    # Limits (openrouter.ai/docs/api/reference/limits, checked 2026-11-09): paid model variants have no
    # platform-level request cap; upstream providers can still answer 429. The 20 rpm here is the factory's own
    # pacing for paid models, not a platform limit. Free variants (`:free`) allow 20 rpm and 50 requests a day, or
    # 1,000 a day once the account has bought at least $10 of credits (it has); each free model below says so itself.
    limits: {rpm: 20, scope: account}
    models:
      - {canonical: llama-3.3-70b, provider_model_id: meta-llama/llama-3.3-70b-instruct, price_in: 0.13, price_out: 0.40}
      - {canonical: gpt-oss-120b,  provider_model_id: openai/gpt-oss-120b,               price_in: 0.10, price_out: 0.50}
      - {canonical: qwen3-32b,     provider_model_id: qwen/qwen3-32b,                    price_in: 0.10, price_out: 0.30}
      # Shortlist of small, cheap tool-calling models. Ids, prices ($/M) and context checked on each model's
      # openrouter.ai page on 2026-11-09. Use free models on synthetic data only: free endpoints may log prompts.
      - {canonical: deepseek-v4.1-flash, provider_model_id: deepseek/deepseek-v4.1-flash, price_in: 0.006, price_out: 0.50,
         caps: {context_len: 1000000}}      # its page doesn't state tool calling; confirm on the first real run
      - {canonical: glm-5.3-flash,       provider_model_id: z-ai/glm-5.3-flash,           price_in: 0.0335, price_out: 0.083,
         caps: {context_len: 1000000}}
      - {canonical: qwen3.6-35b-a3b,     provider_model_id: qwen/qwen3.6-35b-a3b,         price_in: 0.01, price_out: 0.092,
         caps: {context_len: 262144}}
      - {canonical: claude-haiku-5.5,    provider_model_id: anthropic/claude-haiku-5.5,   price_in: 0.10, price_out: 0.50,
         caps: {context_len: 1000000}}
      # The free variant only: one provider (NVIDIA), 1M context; the paid variant is a different endpoint (262K).
      # OpenRouter counts free requests per account, so one free model here keeps this bucket honest; a second
      # free model needs a shared limit instead (both would otherwise get 1,000 a day each).
      - {canonical: "nemotron-3-ultra:free", provider_model_id: "nvidia/nemotron-3-ultra-550b-a55b:free", price_in: 0.0,
         price_out: 0.0, free: true, caps: {context_len: 1000000}, limits: {rpm: 20, rpd: 1000}}
