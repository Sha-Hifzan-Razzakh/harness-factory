# Matrix (retrieval): v2-base with one change, the retrieve.search tool over the task's corpus with hybrid search
# (LlamaIndex QueryFusionRetriever: dense Qdrant index + BM25, reciprocal rank fusion) and a reranker over a pool
# of 15 candidates, 5 passages per call (KNW-02, ADR 0017). Elsewhere it runs exactly like v2-base.
id: v2-retrieval-hybrid
version: 1
base: v2-base
retrieval: {mode: hybrid, top_k: 5, rerank: true}
