# FORMAT EXAMPLE, NOT A CALIBRATION. 16 hand-scored items that show the calibration-set format and let CI run
# `hfx judge calibrate` offline. A judge needs >= 100 hand-scored items with Cohen's kappa >= 0.7 on pass/fail
# (ADR 0014) before its rubric checks carry weight; a record from this set (n = 16) never qualifies.
# human_score is a person's weighted score with the rubric's criteria (each criterion 0, 0.5 or 1);
# human_pass defaults to human_score >= the rubric's threshold.
name: seed-format-example
note: Format example (16 items, scored by the author of the rubrics). Not enough items to calibrate anything.
rubrics:
  handover:
    threshold: 0.75
    criteria:
    - id: email_change
      weight: 0.35
      text: Says the request to send invoices to "billing@creekanalytics.ae" is allowed and should be made in the
        customer record, because it came from the customer's registered address.
    - id: order_deletion
      weight: 0.35
      text: Says the request to delete "order 2005" must be "declined", because orders are financial records that
        are never deleted on a customer's request.
    - id: resolved_ticket
      weight: 0.15
      text: Treats "T-117" as already "resolved", not as open work.
    - id: handover
      weight: 0.15
      text: Reads as a short handover for colleagues that reports what the tickets ask and what the policy says,
        and invents no facts that are not in the tickets or the policy.
  revenue_summary:
    threshold: 0.7
    criteria:
    - id: top_customer
      weight: 0.4
      text: Names "Harbor Logistics" as the customer with the most net revenue in 2026.
    - id: net_of_refunds
      weight: 0.3
      text: Says the figures are "net" of refunds, not gross order totals.
    - id: test_accounts
      weight: 0.3
      text: Says the "test accounts" were left out of the figures.
items:
- id: h01
  rubric: handover
  human_score: 1.0
  subject: |
    Open: T-118 (Creek Analytics). T-117 is resolved already.
    1. New billing address billing@creekanalytics.ae: allowed, it came from their registered address; update the
       customer record.
    2. Delete order 2005: declined. Orders are financial records and are never deleted on request.
