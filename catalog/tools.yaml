# Declared tools (B11). Discovery is checked against this file; any drift fails provisioning.
# code.* (ADR 0012): code can change any file in the sandbox, and a reset undoes it, so both code tools are
# REVERSIBLE; R2 because that reach includes the task database and the git directory, not just the workspace.
# outbox: a sent email or a posted notification can't be called back, so both are IRREVERSIBLE; a customer email
# (send_email) is R3, an internal channel post (notify) R2. calendar: every write can be undone in the mock (moved
# back, restored by moving, cancelled), so all are REVERSIBLE R1.
servers:
- id: fs
  transport: stdio
  module: harness_factory.env.mcp.impl.fs_server
  tools:
  - name: list_dir
    side_effect: READ
    risk: R0
    timeout_s: 10
    schema_hash: a170ba71ba6b7616
    description_hash: fa9b86ff082c4648
  - name: read_file
    side_effect: READ
    risk: R0
    timeout_s: 10
    schema_hash: b73ad10303703476
    description_hash: 870485ec73258bac
  - name: write_file
    side_effect: REVERSIBLE
    risk: R1
    timeout_s: 10
    schema_hash: 7bdc3c044057bdec
    description_hash: 9ee11e7238fc7bd7
  - name: delete_file
    side_effect: IRREVERSIBLE
    risk: R3
    timeout_s: 10
    schema_hash: 2c850ff602bebf4f
    description_hash: a0af53d77780b045
