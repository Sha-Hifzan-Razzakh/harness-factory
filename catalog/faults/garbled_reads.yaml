# Reads that "succeed" but come back cut off or empty. Silent failures: only a harness that checks what it got
# (or verifies after acting) survives them.
id: garbled-reads
description: Half of reads come back truncated; some come back empty.
rules:
  - {tools: ["fs.read_file", "fs.list_dir", "sql.query", "sql.describe_table", "search.find", "search.grep"], kind: garbled, rate: 0.4}
  - {tools: ["fs.read_file", "fs.list_dir", "sql.query", "sql.describe_table", "search.find", "search.grep"], kind: empty, rate: 0.15}
