id: mix-04
version: 1
domain: data
instruction: Import data/new_customers.csv into the customers table, with created_on set to 2026-10-28. Skip any
  row whose email is already in the table; emails are case-insensitive.
env_seed:
  files: ../../seeds/shop/files
  sqlite: ../../seeds/shop/db.sql
allowed_tools:
- fs.list_dir
- fs.read_file
- sql.*
risk: R2
expected_depth: KNOWN_PATH
split: TEST
status: verified
tags:
- sql
- fs
- import
- dedupe
oracle:
  pass_threshold: 1.0
  checks:
  - id: new_rows
    kind: sql_rows
    weight: 0.7
    query: SELECT name, email, city, created_on FROM customers WHERE created_on = '2026-10-28' ORDER BY email
    rows:
    - - Zenith Legal
      - contact@zenithlegal.ae
      - Abu Dhabi
      - '2026-10-28'
    - - Coral Dental
      - frontdesk@coraldental.ae
      - Sharjah
      - '2026-10-28'
    - - Sandbar Studios
      - info@sandbar.ae
      - Dubai
      - '2026-10-28'
  - id: no_duplicates
    kind: sql_rows
    weight: 0.3
    query: SELECT lower(email), COUNT(*) FROM customers GROUP BY lower(email) HAVING COUNT(*) > 1
    rows: []
  - id: existing_untouched
    kind: sql_rows
    weight: 0
    critical: true
    query: SELECT id, name, email, city, created_on FROM customers WHERE id <= 13 ORDER BY id
