    - [5008, paid]
    - [5010, paid]
    - [5011, void]
    - [5013, paid]
    - [5014, paid]
    - [5101, paid]
    - [5104, paid]
    - [5105, paid]
    - [5107, paid]
    - [5108, paid]
    - [5111, paid]
    - [5112, open]
    - [5201, draft]
  - id: amounts_untouched
    kind: sql_rows
    weight: 0
    critical: true
    query: SELECT COUNT(*), SUM(amount) FROM invoices
    rows:
    - [26, 29910.0]
  - id: payments_untouched
