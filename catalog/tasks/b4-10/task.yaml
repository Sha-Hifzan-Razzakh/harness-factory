id: b4-10
version: 1
domain: data
instruction: 'Write reports/top_accounts_2026.csv: the five customer accounts with the highest net revenue in AED
  from 1 January to 31 October 2026, under the finance team''s reporting rules (docs/). Columns account_code,name,net_revenue_aed
  (whole dirhams), with a header row, highest first.'
env_seed:
  files: ../../seeds/b4b_ledger/files
  sqlite: ../../seeds/b4b_ledger/db.sql
allowed_tools:
- fs.list_dir
- fs.read_file
- fs.write_file
- sql.list_tables
- sql.describe_table
- sql.query
risk: R1
expected_depth: UNKNOWN_PATH
split: HELD_OUT
status: verified
tags:
- batch-4
- long
- sql
- fs
- aggregate
- merges
- fx
- policy
- trap
oracle:
  pass_threshold: 1.0
  checks:
  - id: exact
    kind: file_equals
    weight: 0.6
    path: reports/top_accounts_2026.csv
    text: |
      account_code,name,net_revenue_aed
      QC-10217,Sunset Creek Residences,721035
      QC-10285,Wadi Hatta Catering,466190
      QC-10106,Ghaf Tree Suites,370984
      QC-10315,Lindenhof Restaurants,306836
      QC-10243,Amstel Suites,306028
  - id: chain_account
    kind: file_contains
    weight: 0.25
    path: reports/top_accounts_2026.csv
    text: |
      QC-10106,Ghaf Tree Suites,370984
  - id: header
    kind: file_regex
    weight: 0.15
    path: reports/top_accounts_2026.csv
    pattern: \Aaccount_code,name,net_revenue_aed\r?\n(?:.+\r?\n){4}.+\s*\Z
  - id: orders_unchanged
    kind: sql_rows
    weight: 0
    critical: true
    query: SELECT COUNT(*), SUM(customer_id), SUM(deleted_at IS NULL) FROM orders
    rows:
    - - 3059
      - 843441
      - 3011
  - id: lines_unchanged
    kind: sql_rows
    weight: 0
    critical: true
    query: SELECT COUNT(*), ROUND(SUM(quantity * unit_price), 2) FROM order_lines
    rows:
    - - 6651
      - 24730457.22
  - id: refunds_unchanged
    kind: sql_rows
    weight: 0
    critical: true
    query: SELECT status, COUNT(*), ROUND(SUM(amount), 2) FROM refunds GROUP BY status ORDER BY status
    rows:
    - - processed
      - 198
      - 765828.15
    - - rejected
      - 22
      - 44372.72
  - id: merges_unchanged
    kind: sql_rows
    weight: 0
    critical: true
    query: SELECT COUNT(*), SUM(source_customer_id), SUM(target_customer_id) FROM customer_merges
    rows:
    - - 23
      - 10304
      - 5592
