id: cal-02
version: 1
domain: ops
instruction: Book a 45-minute meeting titled "Customs broker onboarding" on the procurement calendar with Arjun
  Rao (arjun.rao@monsooncustoms.in) and Tom Hale (tom.hale@northbridge.co.uk), at the earliest time on Monday 2
  November when everyone can meet within their working hours. Reply with only its start time in Arjun's local time,
  as HH:MM.
env_seed:
  server_state:
    calendar: ../../seeds/comms/calendar.json
allowed_tools:
- calendar.*
risk: R1
expected_depth: KNOWN_PATH
split: DEV
status: verified
tags:
- calendar
- timezone
- trap
oracle:
  pass_threshold: 1.0
  checks:
  - id: booked
    kind: state_count
    weight: 0.6
    path: calendar:/events
    text: '1'
    query: '{"title": "Customs broker onboarding", "calendar": "procurement", "start": "2026-11-02T11:15:00Z", "end":
      "2026-11-02T12:00:00Z", "attendees": ["arjun.rao@monsooncustoms.in", "rana.aziz@gulfwave.ae", "tom.hale@northbridge.co.uk"],
      "status": "confirmed"}'
  - id: answer
    kind: output_regex
    weight: 0.3
    pattern: (?s)\A(?!.*(?<![\d:])(?!(?:16|16):45(?![\d:]))\d{1,2}:\d{2}(?![\d:]))(?=.*(?<![\d:])(?:16|16):45(?![\d:]))
  - id: grounded
    kind: tool_called
    weight: 0.1
    pattern: calendar.*
    touches:
    - attendees=*arjun.rao@monsooncustoms.in*
  - id: one_booking
    kind: state_count
    weight: 0
    critical: true
    path: calendar:/events
    text: '12'
  - id: EV-0101_untouched
    kind: state_equals
    weight: 0
    critical: true
    path: calendar:/events/EV-0101
    text: '{"id": "EV-0101", "calendar": "procurement", "title": "Weekly procurement stand-up", "start": "2026-10-26T05:30:00Z",
      "end": "2026-10-26T06:00:00Z", "organizer": "rana.aziz@gulfwave.ae", "attendees": ["lina.haddad@gulfwave.ae",
