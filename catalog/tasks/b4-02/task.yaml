id: b4-02
version: 1
domain: code
instruction: 'The VAT rate is hard-coded in several places in the ledger package. Make VAT_RATE in ledger/config.py
  the single source of it: every VAT calculation, and every place that shows or exports the VAT rate, must read
  config.VAT_RATE when it runs (import the module with `from ledger import config` and use config.VAT_RATE; don''t
  copy the value into another name), so finance can change the rate in one place. Behaviour must not change: the
  test suite must still pass. Do the work on a new branch named refactor/vat-config, commit it there and leave that
  branch checked out; main must not change.'
env_seed:
  files: ../../seeds/b4a-ledger-vat/files
  git: true
allowed_tools:
- fs.list_dir
- fs.read_file
- fs.write_file
- code.run_tests
- git.status
- git.diff
- git.log
- git.commit
- git.branch
- git.checkout
risk: R2
expected_depth: UNKNOWN_PATH
split: HELD_OUT
status: verified
tags:
- batch-4
- code
- git
- tests
- refactor
- trap
- search
- long
oracle:
  pass_threshold: 1.0
  checks:
  - id: vat_tax_invoice
    kind: tests_pass
    weight: 0.3
    text: |
      import datetime as dt
      from decimal import Decimal

      import pytest

      from ledger import config, reports, tax
      from ledger.exporters.json_export import export_invoice
      from ledger.invoice import Invoice
      from ledger.pos.receipt import receipt_lines

      INV = Invoice("INV-9", "C-1001", dt.date(2026, 3, 4), "AED", Decimal("200.00"))


      @pytest.fixture
      def vat15(monkeypatch):
          """Finance changes the rate in one place, at run time."""
          monkeypatch.setattr(config, "VAT_RATE", type(config.VAT_RATE)("0.15"))


      def test_tax_follows_config(vat15):
          assert tax.vat("200") == Decimal("30.00")
          assert tax.with_vat("40") == Decimal("46.00")


      def test_invoice_follows_config(vat15):
          assert INV.vat == Decimal("30.00")
          assert INV.gross == Decimal("230.00")


      def test_reports_follow_config(vat15):
          assert reports.net_of_vat("115.00") == Decimal("100.00")


      def test_receipt_follows_config(vat15):
          last = receipt_lines([("Pallet wrap", 2, "57.50")])[-1]
          assert last.startswith("VAT 15") and last.endswith("15.00")


      def test_export_follows_config(vat15):
          out = export_invoice(INV)
          assert float(out["vat_rate"]) == 0.15 and out["vat"] == "30.00"
    pattern: tax or invoice
