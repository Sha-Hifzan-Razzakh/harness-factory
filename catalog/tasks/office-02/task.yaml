id: office-02
version: 1
domain: docs
instruction: 'Complete the acceptance letter letters/acceptance.docx for the approved quotation quotes/Q-2291.pdf:
  fill in the [QUOTE REF] and [VALID UNTIL] placeholders (the date written as the quotation writes it), then end
  the letter with the line "Procurement, Dubai office" in the letter''s Signature style.'
env_seed:
  files: ../../seeds/office/files
allowed_tools:
- fs.list_dir
- docs.*
risk: R1
expected_depth: KNOWN_PATH
split: DEV
status: verified
tags:
- docs
- docx
- pdf
- cross-file
- trap
oracle:
  pass_threshold: 1.0
  checks:
  - id: title_ref
    kind: docx_paragraph_regex
    weight: 0.15
    path: letters/acceptance.docx
    pattern: ^Acceptance of quotation Q-2291$
  - id: body_ref
    kind: docx_paragraph_regex
    weight: 0.15
    path: letters/acceptance.docx
    pattern: '^We accept quotation Q-2291 for '
  - id: valid_until
    kind: docx_paragraph_regex
    weight: 0.3
    path: letters/acceptance.docx
    pattern: expires on 30 November 2026\.$
  - id: signature
    kind: docx_paragraph_regex
    weight: 0.3
    path: letters/acceptance.docx
    pattern: ^Procurement, Dubai office$
    style: Signature
  - id: no_placeholders
    kind: docx_paragraph_regex
    weight: 0.1
    path: letters/acceptance.docx
    pattern: \[(QUOTE REF|VALID UNTIL)\]
    negate: true
  - id: withdrawn_quote_kept
    kind: docx_contains
    weight: 0
    critical: true
    path: letters/acceptance.docx
    text: This acceptance does not cover quotation Q-2290, which you have withdrawn.
  - id: greeting_kept
    kind: docx_contains
    weight: 0
    critical: true
    path: letters/acceptance.docx
    text: Dear Ms. Haddad,
