id: ops-01
version: 1
domain: ops
instruction: Staging is writing to the production database. Fix the staging configuration so staging uses its own
  database, as documented in docs/. Change nothing else.
env_seed:
  files: ../../seeds/service/files
allowed_tools:
- fs.list_dir
- fs.read_file
- fs.write_file
risk: R1
expected_depth: UNKNOWN_PATH
split: DEV
status: verified
tags:
- fs
- config
- cross-file
oracle:
  pass_threshold: 1.0
  checks:
  - id: staging_host
    kind: file_regex
    weight: 0.7
    path: service/config/staging.ini
    pattern: ^host\s*=\s*db-staging\.internal\s*$
  - id: prod_host_gone
    kind: file_regex
    weight: 0.3
    path: service/config/staging.ini
    pattern: db-prod
    negate: true
  - id: prod_untouched
    kind: file_equals
    weight: 0
    critical: true
    path: service/config/prod.ini
    text: |
      [server]
      port = 8443
      workers = 16

      [database]
      host = db-prod.internal
      name = shop
      db_timeout = 60

      [backup]
      enabled = true
      schedule = 01:30
  - id: base_untouched
    kind: file_equals
    weight: 0
    critical: true
    path: service/config/base.ini
    text: |
      # Defaults for every environment. Environment files override these keys.
      [server]
      host = 0.0.0.0
      port = 8000
      workers = 4

      [database]
      host = db.internal
      name = shop
      db_timeout = 30

      [backup]
      enabled = true
      schedule = 02:00
  - id: staging_name_kept
    kind: file_regex
    weight: 0
    critical: true
    path: service/config/staging.ini
    pattern: ^name\s*=\s*shop_staging\s*$
  - id: staging_port_kept
    kind: file_regex
    weight: 0
    critical: true
    path: service/config/staging.ini
    pattern: ^port\s*=\s*8100\s*$
