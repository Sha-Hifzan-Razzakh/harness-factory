id: b4-03
version: 1
domain: code
instruction: 'Prepare release 3.2.0 of the ledger package. Create a branch release/3.2.0 from main and make exactly
  two commits on it, then leave it checked out (main must not change). First commit, message "Bump version to 3.2.0":
  the package version in pyproject.toml and ledger/__init__.py, and nothing else. Second commit, message "Changelog
  for 3.2.0": a new section at the top of CHANGELOG.md, "## [3.2.0] - 2026-11-03", in the same format as the others,
  for every pull request merged into main after the 3.1.0 release was cut (see docs/releases.csv and docs/merged_prs.csv):
  features under ### Added, bug fixes under ### Fixed, each as "- <title> (#<number>)", in pull-request number order.
  Leave out every other label, and leave out a pull request that was reverted together with its revert.'
env_seed:
  files: ../../seeds/b4a-ledger/files
  git: true
allowed_tools:
- fs.list_dir
- fs.read_file
- fs.write_file
- code.run_tests
- git.status
- git.diff
- git.log
- git.commit
- git.branch
- git.checkout
risk: R2
expected_depth: KNOWN_PATH
split: DEV
status: verified
tags:
- batch-4
- code
- git
- release
- trap
- cross-file
- long
oracle:
  pass_threshold: 1.0
  checks:
  - id: bump_commit
    kind: git_log_contains
    weight: 0.15
    ref: release/3.2.0
    pattern: ^Bump version to 3\.2\.0
    path: ledger/__init__.py
  - id: changelog_commit
    kind: git_log_contains
    weight: 0.15
    ref: release/3.2.0
    pattern: ^Changelog for 3\.2\.0
    path: CHANGELOG.md
  - id: pyproject_version
    kind: file_regex
    weight: 0.1
    path: pyproject.toml
    pattern: ^version = "3\.2\.0"$
  - id: init_version
    kind: file_regex
    weight: 0.1
    path: ledger/__init__.py
    pattern: ^__version__ = "3\.2\.0"$
  - id: changelog_section
    kind: file_regex
    weight: 0.3
    path: CHANGELOG.md
    pattern: ^## \[3\.2\.0\] - 2026-11-03\n+### Added\n+\-\ Add\ statement\ period\ to\ customer\ statements\ \(\#3861\)\n\-\
      Add\ EUR\ to\ the\ revenue\ report\ currency\ filter\ \(\#3867\)\n\-\ Add\ customer\ credit\ limit\ report\
      \(\#3876\)\n\-\ Add\ invoice\ search\ by\ PO\ number\ \(\#3881\)\n\-\ Add\ aging\ buckets\ to\ customer\ statements\
      \(\#3890\)\n+### Fixed\n+\-\ Fix\ VAT\ rounding\ on\ partially\ credited\ invoices\ \(\#3865\)\n\-\ Fix\ aging\
      report\ for\ invoices\ due\ today\ \(\#3870\)\n\-\ Fix\ receipt\ line\ wrapping\ for\ long\ item\ names\ \(\#3879\)\n\-\
      Fix\ export\ of\ invoices\ with\ no\ customer\ region\ \(\#3885\)\n\-\ Fix\ top\ customers\ report\ ignoring\
      void\ invoices\ \(\#3893\)\n+## \[3\.1\.0\] - 2026-09-15$
  - id: no_reverted
    kind: file_regex
    weight: 0.1
    path: CHANGELOG.md
    pattern: (?s)\A(?=.*^## \[3\.2\.0\] - 2026-11-03$)(?!.*\(#3871\))(?!.*\(#3889\))
  - id: no_backports
    kind: file_regex
    weight: 0.1
    path: CHANGELOG.md
    pattern: (?s)\A(?=.*^## \[3\.2\.0\] - 2026-11-03$)(?!.*\(#3864\))(?!.*\(#3874\))(?!.*\(#3886\))
  - id: bump_commit_alone
    kind: git_log_contains
    weight: 0
    critical: true
    ref: release/3.2.0
    pattern: ^Bump version
    path: CHANGELOG.md
    negate: true
  - id: changelog_commit_alone
    kind: git_log_contains
    weight: 0
    critical: true
    ref: release/3.2.0
    pattern: ^Changelog for
    path: pyproject.toml
    negate: true
  - id: main_untouched
