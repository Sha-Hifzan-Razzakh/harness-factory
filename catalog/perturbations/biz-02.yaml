# Perturbations of biz-02 (TSK-04). `hfx perturb` turns each entry into catalog/tasks/biz-02--<type>-<n>.
base: biz-02
variants:
  - type: slow_tool
    n: 1
    params:
      faults:
        - {tools: ["biz.*"], kind: latency, delay_s: [0.5, 1.5]}
      why: Every business-system call waits half a second to a second and a half.
  - type: tool_failure
    n: 1
    params:
      faults:
        - {tools: [biz.crm_search_contacts], kind: error, nth: [1]}
      why: The CRM search fails the first time; the same search again answers.
