# Perturbations of ops-02 (TSK-04). `hfx perturb` turns each entry into catalog/tasks/ops-02--<type>-<n>.
base: ops-02
variants:
  - type: tool_failure
    n: 1
    params:
      faults:
        - {tools: [fs.read_file], kind: empty, nth: [1]}
      why: The first read comes back empty; reading the file again shows the flags.
  - type: ambiguous_wording
    n: 1
    params:
      instruction: Switch the new checkout on in staging. Keep every other flag as it is.
      vague: It names neither the file nor the flag's key.
      why: The only flags file is service/feature_flags.json, and its one checkout flag is new_checkout.
