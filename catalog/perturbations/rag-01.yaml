# Perturbations of rag-01 (TSK-04). `hfx perturb` turns each entry into catalog/tasks/rag-01--<type>-<n>.
base: rag-01
variants:
  - type: slow_tool
    n: 1
    params:
      faults:
        - {tools: [fs.read_file], kind: latency, delay_s: [0.5, 2.0]}
      why: Every document read waits half a second to two seconds.
  - type: ambiguous_wording
    n: 1
    params:
      instruction: The knowledge base is in corpus/. Under our customer refund policy, what is the largest refund
        a support agent may approve without a manager's sign-off? Answer with the amount in AED and the id of the
        document you took it from (kb-NNN).
      vague: It drops "that is in effect now", and the corpus holds several versions of the policy.
      why: The other versions say what they are (kb-030 is superseded, kb-053 an unapproved draft, kb-001 the
        wholesale desk's); only kb-009 is the customer policy in force.
