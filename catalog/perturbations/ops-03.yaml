# Perturbations of ops-03 (TSK-04). `hfx perturb` turns each entry into catalog/tasks/ops-03--<type>-<n>.
base: ops-03
variants:
  - type: oversized_output
    n: 1
    params:
      target: {file: logs/app-2026-10-26.log}
      pad:
        lines: 600
        template: "2026-10-26T{time}Z {pick:GET /api/search|GET /api/orders|POST /api/checkout|GET /api/products|POST /api/cart} {pick:200|200|200|201|304|404} {int:12-950}ms"
        at: sorted
      call: fs.read_file
      why: The day's log holds 600 more requests, none of them a 5xx, so the server errors are spread through a
        file longer than the inline cap; the answer is unchanged.
  - type: slow_tool
    n: 1
    params:
      faults:
        - {tools: ["fs.*"], kind: latency, delay_s: [0.5, 1.5]}
      why: Every file call waits half a second to a second and a half.
  - type: ambiguous_wording
    n: 1
    params:
      instruction: Which API endpoint returned the most server errors (5xx) on Monday? Answer with the path only.
      vague: The day is a weekday, not a date.
      why: The logs cover 2026-10-25 to 2026-10-27, a Sunday, a Monday and a Tuesday; only 2026-10-26 is a Monday.
